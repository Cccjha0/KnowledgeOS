blueprint_version: 1.1
base_template: standard-workflow
capability_packs: [attachment-processing, deadline-tracking, periodic-summary, event-publishing, high-privacy, immutable-user-content]
module:
  id: course
  display_name: Course
  description: Manage course materials, lectures, assignments, deadlines, and weekly course summaries.
  intended_users: [university-student]
module_class: { type: workflow, complexity: standard }
use_cases:
  primary: [capture lecture material, track assignment deadlines, generate weekly course summaries]
  excluded: [submit assignments, send external email, overwrite user classroom notes]
entities:
  - id: lecture
    ownership: instance
    schema:
      fields:
        lecture_date: { type: date, required: true, provenance_required: true }
        material_kind: { type: enum, values: [slides, notes, recording], required: true }
  - id: assignment
    ownership: instance
    schema:
      fields:
        deadline: { type: datetime, required: true, critical: true, provenance_required: true, freshness_days: 7 }
        status: { type: enum, values: [planned, submitted, graded], required: true, critical: true }
    lifecycle:
      initial: planned
      transitions:
        planned: [submitted]
        submitted: [graded]
        graded: []
  - id: weekly-summary
    ownership: instance
    schema:
      fields:
        week: { type: string, required: true }
inputs: [markdown, pdf, pptx]
outputs:
  - { id: lecture-note, entity: lecture, schema: lecture, template: templates/lecture.md, target: '{instance.content_root}/Lectures/{task.payload.item_id}.md' }
  - { id: assignment-record, entity: assignment, schema: assignment, template: templates/assignment.md, target: '{instance.content_root}/Assignments/{task.payload.item_id}.md' }
  - { id: weekly-summary, entity: weekly-summary, schema: weekly-summary, template: templates/weekly-summary.md, target: '{instance.content_root}/Summaries/{schedule.iso_week}.md' }
inbox:
  module_level: true
  instance_level: true
  global_routing: true
  default_asset_role: lecture-material
  roles:
    lecture-material:
      inbox_subpath: Lectures
      access_policy: { sensitivity_class: 1, max_representation: full }
      entrypoint: normalize-lecture
      allow_codex: true
    assignment-brief:
      inbox_subpath: Assignments
      access_policy: { sensitivity_class: 2, max_representation: full }
      entrypoint: normalize-assignment
      allow_codex: true
    private-document:
      inbox_subpath: Private
      access_policy: { sensitivity_class: 3, max_representation: metadata }
      required_user_action: resolve-review
      allow_codex: false
privacy:
  default_sensitivity_class: 2
  default_max_representation: full
  network_allowed: false
  user_original_content_mutable: false
workflows:
  - id: normalize-lecture
    trigger: capture
    requires_ai: true
    input_entities: [capture]
    input_roles: [lecture-material]
    output_entity: lecture
    read: { representation: full }
    prompt: { id: normalize-lecture }
    operation: { type: create-record, target: '{instance.content_root}/Lectures/{task.payload.item_id}.md', template: templates/lecture.md }
    review_when: [{ field: lecture.lecture_date, condition: missing-or-conflicting }]
    publishes: [{ event: course.lecture-created, payload: { lecture_id: '{output.id}' } }]
  - id: normalize-assignment
    trigger: capture
    requires_ai: true
    input_entities: [capture]
    input_roles: [assignment-brief]
    output_entity: assignment
    read: { representation: full }
    prompt: { id: normalize-assignment }
    operation: { type: create-record, target: '{instance.content_root}/Assignments/{task.payload.item_id}.md', template: templates/assignment.md }
    review_when: [{ field: assignment.deadline, condition: missing-or-conflicting }]
    publishes: [{ event: course.assignment-created, payload: { assignment_id: '{output.id}' } }]
  - id: generate-weekly-summary
    trigger: schedule
    requires_ai: true
    input_entities: [lecture, assignment]
    sources:
      - entity: lecture
        window: current-week
        date_field: lecture_date
      - entity: assignment
        window: active-or-upcoming
        date_field: deadline
    output_entity: weekly-summary
    read: { representation: summary }
    prompt: { id: generate-weekly-summary }
    operation: { type: create-record, target: '{instance.content_root}/Summaries/{schedule.iso_week}.md', template: templates/weekly-summary.md }
review_policy:
  critical_fields: [assignment.deadline, assignment.status]
  ambiguous_input: review
  destructive_operations: forbidden
jobs:
  - id: weekly-summary
    workflow_id: generate-weekly-summary
    schedule: weekly
    at: '18:00'
    timezone: instance
    scope: instance
    catch_up: latest
    retry: { max_attempts: 3, strategy: exponential }
    concurrency: { policy: forbid, key: 'course:{instance}:weekly-summary' }
    max_age_days: 21
events:
  publishes: [course.lecture-created, course.assignment-created]
  subscribes: []
dashboard:
  items:
    - id: upcoming-deadlines
      kind: due
      entity: assignment
      due_field: deadline
      filters: { status: [planned] }
      window_days: 14
      category: deadline
      priority: { overdue: critical, within_3_days: high, default: medium }
      title: "{title}"
      description: "Deadline: {deadline}"
      actions: [open]
    - id: recent-lectures
      kind: recent
      entity: lecture
      date_field: lecture_date
      limit: 5
      category: summary
      priority: low
      title: "{title}"
      description: "Lecture date: {lecture_date}"
      actions: [open]
    - id: waiting-reviews
      kind: review-summary
      category: status
      priority: high
      title: "{count} course reviews need a decision"
      description: "{count} course review items are waiting for your decision."
      actions: [open]
testing:
  normal_input: required
  ambiguous_input: required
  repeat_execution: required
  permission_denied: required
  paused_instance: required
  archived_instance: required
  prompt_regression: required
  periodic_job: required
  event_publication: required
  event_consumption: not-applicable
  migration: not-applicable
  attachment_policy: required
