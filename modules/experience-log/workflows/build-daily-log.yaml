id: build-daily-log
version: 1
workflow_id: build-daily-log
workflow_version: 1.0.0
inputs: [capture, instance]
steps:
  - id: validate-capture
    uses: core.validate-capture
  - id: parse-entry
    uses: core.parse-structured-document
    with:
      output_schema: schemas/experience-entry.schema.json
      time_anchor:
        field: occurred_at
        unit: day
        required: true
  - id: collect-same-day
    uses: core.query-documents
    with:
      root: "{instance.content_root}/Inbox"
      filters:
        instance_id:
          equals: "{instance.instance_id}"
      time_window:
        field: occurred_at
        unit: day
        reference: "{schedule.date}"
      missing_time: fail
      schema: experience-entry
  - id: structure-daily-log
    uses: codex.prompt
    with:
      prompt: prompts/structure-daily-log.md
      output_schema: schemas/daily-log.schema.json
  - id: build-plan
    uses: core.build-operation-plan
outputs: [operation_plan, dashboard_items, events]
