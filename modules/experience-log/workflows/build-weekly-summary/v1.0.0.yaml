id: build-weekly-summary
version: 1
workflow_id: build-weekly-summary
workflow_version: 1.0.0
inputs: [instance, schedule]
resources: { filesystem: required, network: not-required, codex: required, user: not-required }
context_budget:
  max_files: 50
  max_total_bytes: 500000
  max_file_bytes: 50000
  max_estimated_tokens: 125000
  overflow_policy: truncate-and-review
steps:
  - id: collect-week
    uses: core.query-documents
    with:
      root: "{instance.content_root}/Daily"
      read_level: 2
      filters:
        instance_id:
          equals: "{instance.instance_id}"
      time_window:
        field: date
        unit: week
        reference: "{schedule.iso_week}"
      missing_time: fail
      schema: daily-log
  - id: summarize
    uses: codex.prompt
    with:
      prompt_id: weekly-summary
      output_schema: weekly-summary
  - id: build-plan
    uses: core.build-operation-plan
    with:
      output: summarize
      output_schema: weekly-summary
      target: "{instance.content_root}/Weekly/{schedule.iso_week}.md"
      template: templates/weekly-summary.md
      idempotency_key: "experience-log:{instance.instance_id}:weekly:{schedule.iso_week}"
      summary: "Create {schedule.iso_week} experience weekly summary"
  - id: publish-weekly-summary-created
    uses: core.publish-event
    with:
      event_type: experience.weekly-summary-created
      payload: { period: "{schedule.iso_week}" }
outputs: [operation_plan, dashboard_items, events]
