id: build-daily-log
version: 1
workflow_id: build-daily-log
workflow_version: 1.0.0
inputs: [capture, instance]
steps:
  - id: validate-capture
    uses: core.validate-capture
  - id: parse-entry
    uses: core.parse-structured-document
  - id: collect-same-day
    uses: core.find-by-fields
    with:
      root: "{instance.content_root}/Inbox"
      fields: [instance_id, occurred_at]
  - id: structure-daily-log
    uses: codex.prompt
    with:
      prompt_id: normalize-daily-log
      output_schema: daily-log
  - id: build-plan
    uses: core.build-operation-plan
    with:
      output: structure-daily-log
      output_schema: daily-log
      target: "{instance.content_root}/Daily/{schedule.date}.md"
      template: templates/daily-log.md
      idempotency_key: "experience-log:{instance.instance_id}:daily:{schedule.date}"
      summary: "Create {schedule.date} experience daily log"
outputs: [operation_plan, dashboard_items, events]
