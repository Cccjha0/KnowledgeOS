id: build-daily-log
version: 1
workflow_id: build-daily-log
workflow_version: 1.0.0
inputs: [capture, instance]
resources: { filesystem: required, network: not-required, codex: required, user: not-required }
steps:
  - id: validate-capture
    uses: core.validate-capture
  - id: parse-entry
    uses: core.parse-structured-document
    with:
      time_anchor:
        field: occurred_at
        unit: day
        required: true
  - id: collect-same-day
    uses: core.query-documents
    with:
      root: "{instance.content_root}/Inbox"
      filters:
        instance_id:
          equals: "{instance.instance_id}"
      time_window:
        field: occurred_at
        unit: day
        reference: "{schedule.date}"
      missing_time: fail
      schema: experience-entry
  - id: structure-daily-log
    uses: codex.prompt
    with:
      prompt_id: normalize-daily-log
      output_schema: daily-log
  - id: build-plan
    uses: core.build-operation-plan
    with:
      output: structure-daily-log
      output_schema: daily-log
      target: "{instance.content_root}/Daily/{schedule.date}.md"
      template: templates/daily-log.md
      idempotency_key: "experience-log:{instance.instance_id}:daily:{schedule.date}"
      summary: "Create {schedule.date} experience daily log"
  - id: publish-daily-log-created
    uses: core.publish-event
    with:
      event_type: experience.daily-log-created
      payload: { period: "{schedule.date}" }
outputs: [operation_plan, dashboard_items, events]
