id: build-weekly-summary
version: 1
workflow_id: build-weekly-summary
workflow_version: 1.0.0
inputs: [instance, schedule]
steps:
  - id: collect-week
    uses: core.query-documents
    with:
      root: "{instance.content_root}/Daily"
      filters:
        instance_id:
          equals: "{instance.instance_id}"
      time_window:
        field: date
        unit: week
        reference: "{schedule.iso_week}"
      missing_time: fail
      schema: daily-log
  - id: summarize
    uses: codex.prompt
    with:
      prompt: prompts/weekly-summary.md
      output_schema: schemas/weekly-summary.schema.json
  - id: build-plan
    uses: core.build-operation-plan
outputs: [operation_plan, dashboard_items, events]
