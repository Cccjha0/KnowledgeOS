id: experience-log
name: 实习经历日志
version: 0.2.0
maturity: beta
status: enabled
description: 将零散实习记录整理为结构化日报，并按周生成总结。

engine:
  api_version: 1
  min_version: 0.1.0
  max_version: 0.x

data:
  schema_version: 1

module_type: workflow

capabilities:
  - capture-processing
  - metadata-enrichment
  - file-organization
  - periodic-summary
  - dashboard-items
  - event-publishing

accepted_inputs:
  - markdown
  - text

inbox:
  module_level:
    enabled: true
    path: 20-Workspace/Experience Log/Inbox
  instance_level:
    enabled: true
    path_pattern: "{instance_root}/Inbox"
  allow_global_routing: true

routing:
  matcher: workflows/match/v1.0.0.yaml
  auto_route_threshold: 0.85
  review_threshold: 0.60

entry_workflows:
  capture: workflows/build-daily-log/v1.0.0.yaml
  weekly_summary: workflows/build-weekly-summary/v1.0.0.yaml

schemas:
  registry: schemas/index.yaml
  instance: schemas/experience-instance.schema.json
  experience_entry: schemas/experience-entry.schema.json
  daily_log: schemas/daily-log.schema.json
  weekly_summary: schemas/weekly-summary.schema.json

prompts:
  registry: prompts/index.yaml

workflows:
  registry: workflows/index.yaml

jobs:
  registry: jobs.yaml

rules:
  paths: rules/paths.yaml
  aggregation: rules/aggregation.yaml
  review: rules/review-policy.yaml

dashboard:
  provider: dashboard/today-provider.yaml

events:
  publishes:
    - experience.daily-log-created
    - experience.weekly-summary-created
  subscribes:
    - file.added

dependencies:
  components:
    timeline: ^1.0.0

scheduled_jobs:
  - id: weekly-summary
    schedule: "0 18 * * 5"
    workflow: workflows/build-weekly-summary.yaml
    timezone: instance

permissions:
  max_read_level: 0
  network: false
  codex: optional
  delete: false
  cross_module_write: false
  max_default_read_level: 0
  allow_external_network: false
  allow_delete: false
  allow_bulk_move: false

instance_form:
  content_root_pattern: "20-Workspace/Experience Log/{instance_id}"
  inbox_path_pattern: "{content_root}/Inbox"
  fields:
    - key: organization
      label: 组织
      type: text
      required: true
    - key: role
      label: 职位
      type: text
      required: true
    - key: start_date
      label: 开始日期
      type: date
      required: true
    - key: end_date
      label: 结束日期
      type: date
      required: false
      default: null
    - key: timezone
      label: 时区
      type: timezone
      required: true
      default: Asia/Shanghai
