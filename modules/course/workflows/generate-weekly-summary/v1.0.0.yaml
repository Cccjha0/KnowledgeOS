workflow_id: generate-weekly-summary
workflow_version: 1.0.0
inputs:
- instance
- period
resources:
  filesystem: required
  network: not-required
  codex: required
  user: not-required
steps:
- id: summarize
  uses: codex.prompt
  with:
    prompt_id: weekly-summary
    output_schema: https://pkb.local/schemas/course/record.schema.json
- id: plan
  uses: core.build-operation-plan
  with:
    output: summarize
    output_schema: record
    target: '{instance.content_root}/Summaries/{schedule.iso_week}.md'
    template: templates/record.md
    idempotency_key: course:{instance.instance_id}:generate-weekly-summary:{schedule.iso_week}
    summary: Create generate-weekly-summary
outputs:
- operation_plan
