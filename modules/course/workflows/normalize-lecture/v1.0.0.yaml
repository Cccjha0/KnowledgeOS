workflow_id: normalize-lecture
workflow_version: 1.0.0
inputs:
- capture
- instance
resources:
  filesystem: required
  network: not-required
  codex: required
  user: not-required
steps:
- id: validate-capture
  uses: core.validate-capture
  with:
    read:
      representation: full
- id: parse-capture
  uses: core.parse-structured-document
  with:
    read:
      representation: full
- id: normalize
  uses: codex.prompt
  with:
    prompt_id: normalize-lecture
    output_schema: https://pkb.local/schemas/course/lecture.schema.json
- id: require-lecture-review
  uses: core.require-review-if
  with:
    target: '{instance.content_root}/Lectures/{task.payload.item_id}.md'
    proposed_from: normalize
    rules:
    - field: lecture.lecture_date
      condition: missing-or-conflicting
- id: plan
  uses: core.build-operation-plan
  with:
    output: normalize
    output_schema: lecture
    target: '{instance.content_root}/Lectures/{task.payload.item_id}.md'
    template: templates/lecture.md
    operation_type: create-record
    idempotency_key: course:{instance.instance_id}:normalize-lecture:{task.payload.item_id}
    summary: Create lecture from normalized material
- id: publish-lecture-created
  uses: core.publish-event
  with:
    event_type: course.lecture-created
    payload_from: normalize
    payload_fields:
      lecture_id: id
outputs:
- operation_plan
- dashboard_items
- events
blueprint_contract:
  trigger: capture
  input_entities: [capture]
  input_roles: [lecture-material]
  role_policies:
    lecture-material: { allow_codex: true }
  output_entity: lecture
  read: { representation: full }
  prompt_id: normalize-lecture
  operation:
    type: create-record
    target: '{instance.content_root}/Lectures/{task.payload.item_id}.md'
    template: templates/lecture.md
  publishes:
  - event: course.lecture-created
    payload:
      lecture_id: '{output.id}'
