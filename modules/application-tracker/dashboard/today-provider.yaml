provider_id: application-tracker-today
version: 1
implementation: src/application/dashboard.ts

project_fields:
  - current_project
  - application_status
  - next_check
  - pending_review_count
  - material_progress
  - last_updated
  - next_action

items:
  - source: application-record
    category: status
    actions: [open, generate]
  - source: research-request
    category: research
    actions: [open, run]
  - source: application-document
    aggregate: material_progress
  - source: review-item
    aggregate: pending_review_count
