critical_fields: [application_status, application_open, deadline, tuition, academic_requirement, english_requirement]
provenance_required: [application_status, application_open, deadline, tuition, academic_requirement, english_requirement]
freshness:
  application_open: { interval_days: 7, stale_action: { type: workflow, workflow_id: sync-due-research, workflow_version: "1.0.0", resources: { filesystem: required, network: not-required, codex: not-required, user: required }, dedupe: { entity_type: research-request, target_field: record_path, open_statuses: [pending, in-progress, needs-more-information] } } }
  application_status: { interval_days: 7, stale_action: { type: workflow, workflow_id: sync-due-research, workflow_version: "1.0.0", resources: { filesystem: required, network: not-required, codex: not-required, user: required }, dedupe: { entity_type: research-request, target_field: record_path, open_statuses: [pending, in-progress, needs-more-information] } } }
  deadline: { interval_days: 14, stale_action: { type: workflow, workflow_id: sync-due-research, workflow_version: "1.0.0", resources: { filesystem: required, network: not-required, codex: not-required, user: required }, dedupe: { entity_type: research-request, target_field: record_path, open_statuses: [pending, in-progress, needs-more-information] } } }
  tuition: { interval_days: 60, stale_action: { type: workflow, workflow_id: sync-due-research, workflow_version: "1.0.0", resources: { filesystem: required, network: not-required, codex: not-required, user: required }, dedupe: { entity_type: research-request, target_field: record_path, open_statuses: [pending, in-progress, needs-more-information] } } }
  academic_requirement: { interval_days: 60, stale_action: { type: workflow, workflow_id: sync-due-research, workflow_version: "1.0.0", resources: { filesystem: required, network: not-required, codex: not-required, user: required }, dedupe: { entity_type: research-request, target_field: record_path, open_statuses: [pending, in-progress, needs-more-information] } } }
  english_requirement: { interval_days: 60, stale_action: { type: workflow, workflow_id: sync-due-research, workflow_version: "1.0.0", resources: { filesystem: required, network: not-required, codex: not-required, user: required }, dedupe: { entity_type: research-request, target_field: record_path, open_statuses: [pending, in-progress, needs-more-information] } } }
ownership:
  application-record:
    required: true
    sections:
      来源: source-immutable
      AI整理: ai-managed
      系统状态: system-managed
      用户确认结论: mixed
  research-report:
    required: true
    sections:
      官方原文: source-immutable
      结论: ai-managed
      未解决事项: ai-managed
      系统信息: system-managed
      用户备注: user-owned
audits: [stale-fields, missing-provenance, invalid-status, schema-version, ownership, instance-task]
orphan_exempt_entity_types: [research-request, research-report]
default_verification_interval_days: 30
