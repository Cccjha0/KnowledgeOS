id: application-tracker
name: 申请跟踪
version: 0.3.0-beta
maturity: beta
status: enabled

description: >
  管理硕士、博士、奖学金、工作和实习申请。
  MVP 先实现外部研究报告的路由、比较、审核和复查提醒。

ui:
  display_name: 申请跟踪
  icon: graduation-cap
  field_labels:
    application_status: 申请状态
    application_open: 申请开放状态
    deadline: 申请截止日期
    tuition: 学费
    english_requirement: 英语要求
    academic_requirement: 学术要求
  job_labels:
    due-check: 检查到期申请
    sync-due-research: 同步到期核验请求

engine:
  api_version: 1
  min_version: 0.9.0-beta
  max_version: 0.x

data:
  schema_version: 2

module_type: workflow

capabilities:
  - capture-processing
  - metadata-enrichment
  - file-organization
  - dashboard-items
  - review-items
  - research-request
  - event-publishing

accepted_inputs:
  - markdown
  - json
  - yaml
  - pdf

# Application facts can be critical. A truncated PDF must be explicitly
# reviewed instead of silently becoming AI input.
pdf_policy:
  accepted_statuses:
    - completed
  partial_policy: review

# This is the complete module-owned contract consumed by the generic
# research-request Component. Core never assumes an Application Record.
research_request:
  record:
    search_root: 20-Workspace/Applications
    directory: Records
    type: application-record
    schema: https://pkb.local/schemas/application-tracker/application-record.schema.json
    id_field: id
    instance_id_field: instance_id
    active_path: monitoring.active
    due_path: monitoring.next_check
    requested_fields_path: facts
    requested_field_status_path: status
    requested_field_statuses: [unknown, pending, conflicting]
    fallback_requested_fields: [application_open, deadline, tuition, academic_requirement, english_requirement]
  request:
    directory: Research Requests
    type: research-request
    schema: https://pkb.local/schemas/application-tracker/research-request.schema.json
    id_field: request_id
    record_id_field: application_id
    record_path_field: record_path
    instance_id_field: instance_id
    status_field: status
    report_ids_field: report_ids
    idempotency_key_field: idempotency_key
    id_prefix: REQ
    open_statuses: [pending, in-progress, needs-more-information]
    reason: The application record reached its scheduled verification time.
    body:
      title: "Research Request {request_id}"
      record_label: Application
      instructions: Give this request to a web-enabled research assistant. The returned Research Report must set request_id to this request ID and be placed in the instance Inbox.

inbox:
  # Legacy/root-Inbox fallback. New files should be placed in one of the role
  # folders below, so their policy is bound to their actual purpose.
  asset_access_policy:
    sensitivity_class: 2
    max_representation: full
  default_asset_role: research-report
  asset_roles:
    research-report:
      inbox_subpath: Research
      asset_access_policy:
        sensitivity_class: 2
        max_representation: full
      entrypoint: capture
    application-document:
      inbox_subpath: Documents
      asset_access_policy:
        sensitivity_class: 3
        max_representation: metadata
      required_user_action: resolve-review
    private-material:
      inbox_subpath: Private
      asset_access_policy:
        sensitivity_class: 3
        max_representation: metadata
      required_user_action: resolve-review
  module_level:
    enabled: true
    path: 20-Workspace/Applications/Inbox
  instance_level:
    enabled: true
    path_pattern: "{instance_root}/Inbox"
  allow_global_routing: true

# The Core Inbox reads this descriptor generically. It does not know what an
# application research report is, nor where the module will materialize it.
inbox_processors:
  research-report:
    label: Application research report
    risk: mixed-by-module-plan
    preview_target: Application Record and Research archive
    preview_kind: module-processing
    content_type: research-report
    instance_field: instance_id
    matcher:
      fields:
        research_type: application-update
      required_fields: [report_id, instance_id]

routing:
  matcher: workflows/match/v1.0.0.yaml
  auto_route_threshold: 0.90
  review_threshold: 0.65

entry_workflows:
  capture: workflows/process-research-report/v1.0.0.yaml
  review_resolve: workflows/review-resolve/v1.0.0.yaml
  archive: workflows/archive-instance/v1.0.0.yaml

schemas:
  registry: schemas/index.yaml
  instance: schemas/application-instance.schema.json
  application_record: schemas/application-record.schema.json
  research_report: schemas/research-report.schema.json
  application_document: schemas/application-document.schema.json
  research_request: schemas/research-request.schema.json
  update_result: schemas/update-result.schema.json

prompts:
  registry: prompts/index.yaml

workflows:
  registry: workflows/index.yaml

jobs:
  registry: jobs.yaml

rules:
  paths: rules/paths.yaml
  review: rules/review-policy.yaml
  reading: rules/reading-policy.yaml
  application_state_machine: rules/application-state-machine.yaml

quality:
  policy: rules/quality-policy.yaml

dashboard:
  provider: dashboard/today-provider.yaml

events:
  publishes:
    - research.required
    - instance.archived

dependencies:
  components:
    status-machine: ^1.0.0
    research-request: ^1.0.0
    comparison-table: ^1.0.0
    research-reconciliation: ^1.0.0
    research-request-scheduler: ^1.0.0

scheduled_jobs: []

permissions:
  max_sensitivity_class: 2
  network: false
  codex: optional
  delete: false
  cross_module_write: false
  allow_external_network: false
  allow_delete: false
  allow_bulk_move: false

instance_form:
  content_root_pattern: "20-Workspace/Applications/{instance_id}"
  inbox_path_pattern: "{content_root}/Inbox"
  fields:
    - key: application_type
      label: 申请类型
      type: select
      required: true
      default: masters
      options: [masters, phd, scholarship, job, internship, other]
    - key: region
      label: 地区
      type: text
      required: true
    - key: intake
      label: 入学批次
      type: text
      required: true
    - key: default_currency
      label: 默认货币
      type: text
      required: true
      default: AUD
    - key: monitoring.enabled
      label: 启用定期核验
      type: boolean
      required: true
      default: true
    - key: monitoring.default_check_interval_days
      label: 默认核验间隔（天）
      type: number
      required: true
      default: 30
