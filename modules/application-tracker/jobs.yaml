jobs:
  - id: due-research-check
    scope: module
    enabled: true
    task_type: workflow
    workflow: module:application-tracker:sync-due-research
    workflow_id: sync-due-research
    workflow_version: 1.0.0
    trigger:
      type: field-due
      source_root: 20-Workspace/Applications
      field: monitoring.next_check
      id_field: instance_id
    catch_up: { policy: latest, max_age_days: 14 }
    retry: { max_attempts: 3, strategy: exponential }
    concurrency: { policy: forbid, key: application-tracker:due-research }
    priority: normal
