id: process-research-report
version: 1
workflow_id: process-research-report
workflow_version: 1.0.0

inputs:
  - capture
  - instance

steps:
  - id: validate-capture
    uses: core.validate-capture

  - id: parse-source
    uses: core.parse-structured-document

  - id: normalize-report
    uses: codex.prompt
    with:
      prompt_id: normalize-application-report
      output_schema: research-report
      skip_if_valid_schema: research-report
      fixed_fields:
        source_module: "{module.id}"
        type: research-report
        schema_version: 1
        report_id: { task_id_prefix: RPT }
        research_type: application-update
        instance_id: "{instance.instance_id}"
      default_null_fields: [request_id]

  - id: locate-target-record
    uses: core.find-by-fields
    with:
      root: "{instance.content_root}/Records"
      fields:
        - institution
        - program_code
        - program_name
        - intake

  - id: reconcile
    uses: component.research-reconciliation
    with:
      report: normalize-report
      record_candidates: locate-target-record

  - id: build-plan
    uses: core.build-operation-plan
    with:
      plan_from: reconcile
      record_processed_report: true
      normalize_source_from: normalize-report
      source_schema: research-report

outputs:
  - operation_plan
  - dashboard_items
