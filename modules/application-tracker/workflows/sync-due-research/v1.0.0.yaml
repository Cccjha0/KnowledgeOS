workflow_id: sync-due-research
workflow_version: 1.0.0
inputs: [application-records]
resources: { filesystem: required, network: not-required, codex: not-required, user: not-required }
steps:
  - id: prepare-due-requests
    uses: component.research-request-scheduler
  - id: create-request-plan
    uses: core.build-operation-plan
    with:
      plan_from: prepare-due-requests
  - id: publish-research-required
    uses: core.publish-event
    with:
      event_type: research.required
      payload_from: prepare-due-requests
      payload_fields:
        entity_id: created.0
      only_if_created_from: prepare-due-requests
outputs: [operation_plan, events]
