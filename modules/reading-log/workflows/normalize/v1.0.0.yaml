workflow_id: normalize
workflow_version: 1.0.0
inputs:
- capture
- instance
resources:
  filesystem: required
  network: not-required
  codex: required
  user: not-required
steps:
- id: validate-capture
  uses: core.validate-capture
- id: parse-capture
  uses: core.parse-structured-document
- id: normalize
  uses: codex.prompt
  with:
    prompt_id: normalize-record
    output_schema: https://pkb.local/schemas/reading-log/record.schema.json
- id: plan
  uses: core.build-operation-plan
  with:
    output: normalize
    output_schema: record
    target: "{instance.content_root}/Notes/{task.payload.item_id}.md"
    template: templates/record.md
    idempotency_key: "reading-log:{instance.instance_id}:note:{task.payload.item_id}"
    summary: "Create a reading note from Inbox capture"
- id: publish-record-created
  uses: core.publish-event
  with:
    event_type: reading-log.record-created
    payload: { source_item_id: "{task.payload.item_id}" }
outputs:
- operation_plan
- dashboard_items
- events
