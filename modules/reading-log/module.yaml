id: reading-log
name: Reading Log
version: 0.2.0-beta
maturity: beta
status: enabled
description: Turn scattered reading captures into sourced reading notes, a lightweight title index, and weekly summaries.
ui:
  display_name: 阅读记录
  icon: book-open
  field_labels:
    title: 标题
    created: 创建时间
    author: 作者
    source: 来源
  job_labels:
    weekly-summary: 生成阅读周报

engine:
  api_version: 1
  min_version: 0.9.0-beta
  max_version: 0.x
data:
  schema_version: 1
module_type: configuration
capabilities:
- capture-processing
- metadata-enrichment
- dashboard-items
- periodic-summary
- event-publishing
accepted_inputs:
- markdown
- text
- pdf
pdf_policy:
  # Reading material can remain useful when only a subset of its pages has
  # extractable text, but the user must still classify the attachment first.
  accepted_statuses:
  - completed
  - partial
  partial_policy: allow
inbox:
  module_level:
    enabled: true
    path: 20-Workspace/Reading Log/Inbox
  instance_level:
    enabled: true
    path_pattern: '{content_root}/Inbox'
  allow_global_routing: true
routing:
  matcher: workflows/classify/v1.0.0.yaml
  auto_route_threshold: 0.85
  review_threshold: 0.6
entry_workflows:
  capture: workflows/normalize/v1.0.0.yaml
schemas:
  registry: schemas/index.yaml
  instance: schemas/instance.schema.json
  record: schemas/record.schema.json
  reading_index: schemas/reading-index.schema.json
  weekly_summary: schemas/weekly-summary.schema.json
prompts:
  registry: prompts/index.yaml
workflows:
  registry: workflows/index.yaml
rules:
  paths: rules/paths.yaml
  review: rules/review-policy.yaml
  permissions: rules/permissions.yaml
quality:
  policy: rules/quality-policy.yaml
dashboard:
  provider: dashboard/provider.yaml
jobs:
  registry: jobs/jobs.yaml
events:
  publishes:
  - reading-log.record-created
  - reading-log.weekly-summary-created
dependencies:
  components:
    periodic-rollup: ^1.0.0
scheduled_jobs: []
permissions:
  max_sensitivity_class: 2
  network: false
  codex: optional
  delete: false
  cross_module_write: false
  allow_external_network: false
  allow_delete: false
  allow_bulk_move: false
instance_form:
  content_root_pattern: 20-Workspace/Reading Log/{instance_id}
  inbox_path_pattern: '{content_root}/Inbox'
  fields:
  - key: timezone
    label: Timezone
    type: timezone
    required: true
    default: Asia/Shanghai
