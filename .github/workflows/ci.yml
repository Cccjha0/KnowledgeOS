name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A feature-branch push already triggers its PR workflow. Running both events
# for the same SHA doubles this 8-job matrix and has caused runner setup jobs
# and long Engine tests to be cancelled under hosted-runner contention.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-install:
    name: clean install / Ubuntu / Node 22 / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify dependency installation without shared caches
        env:
          npm_config_cache: ${{ runner.temp }}/npm-clean-cache
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-clean-cache
        run: |
          npm ci --registry=https://registry.npmjs.org
          python -m venv "${{ runner.temp }}/knowledgeos-clean-venv"
          "${{ runner.temp }}/knowledgeos-clean-venv/bin/python" -m pip install --no-cache-dir -r requirements.txt

  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Each matrix job runs disposable Vault and Python Bridge integration
      # tests. Keep the full compatibility matrix, but do not compete for all
      # hosted runners at once.
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
        python: ['3.11', '3.13']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Enforce Core boundaries
        run: npm run check:boundaries

      - name: Lint and type-check sources
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Build and verify Obsidian plugin bundle
        run: |
          npm run build:plugin
          node --check plugins/knowledgeos-obsidian/dist/main.js

      - name: Validate Python schemas and versioned fixtures
        run: python tools/validate.py

      - name: Run Engine tests, including the PDF adapter
        run: npm run test:engine

      - name: Run plugin Command API smoke test
        run: npm run test:plugin-smoke

      - name: Validate modules
        run: |
          node dist/cli.js module validate application-tracker
          node dist/cli.js module validate experience-log
          node dist/cli.js module validate reading-log

      - name: Run executable module contracts
        run: |
          node dist/cli.js module test application-tracker
          node dist/cli.js module test experience-log
          node dist/cli.js module test reading-log

  required:
    name: required
    if: always()
    needs: [clean-install, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        env:
          CLEAN_INSTALL_RESULT: ${{ needs.clean-install.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$CLEAN_INSTALL_RESULT" != "success" ]; then
            echo "The clean-install job failed: $CLEAN_INSTALL_RESULT"
            exit 1
          fi
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "At least one CI matrix job failed: $VERIFY_RESULT"
            exit 1
          fi
